<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2590d",
                        "background-light": "#f8f6f5",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Header Section -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start" data-icon="arrow_back">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Personal Details</h2>
</div>
<!-- Progress Bar -->
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between items-end">
<p class="text-slate-900 dark:text-slate-100 text-base font-bold leading-none">Onboarding</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium leading-none">Step 3 of 4</p>
</div>
<div class="rounded-full bg-primary/20 h-2 w-full overflow-hidden">
<div class="h-full rounded-full bg-primary" style="width: 75%;"></div>
</div>
</div>
<!-- Hero Content -->
<h3 class="text-slate-900 dark:text-slate-100 tracking-tight text-2xl font-bold leading-tight px-4 text-left pb-1 pt-5">Complete your profile</h3>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed pb-6 px-4">This helps local businesses and causes verify your identity for secure transactions.</p>
<!-- Form Section -->
<div class="flex flex-col gap-5 px-4 pb-32">
<!-- Full Name (Pre-filled style) -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Full Name</label>
<div class="relative">
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 border border-primary/20 bg-white dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary h-14 p-4 text-base font-medium shadow-sm transition-all" placeholder="Enter your full name" type="text" value="Alex Thompson"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-primary/60">
<span class="material-symbols-outlined text-xl">check_circle</span>
</div>
</div>
</div>
<!-- Date of Birth -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Date of Birth</label>
<div class="relative">
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary h-14 p-4 text-base font-normal shadow-sm transition-all" type="date"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
<span class="material-symbols-outlined text-xl">calendar_today</span>
</div>
</div>
</div>
<!-- Delivery Address with Map -->
<div class="flex flex-col gap-2 pt-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Delivery Address</label>
<!-- Map Preview Card -->
<div class="relative w-full h-44 rounded-xl overflow-hidden mb-3 border border-slate-200 dark:border-slate-700 shadow-sm">
<img class="w-full h-full object-cover" data-alt="Detailed city map view with delivery pin location" data-location="New York City" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCT9cgQpW1PVAQrgED8Hr1lJeK4SdG3MQdMznz2nMaTEvCUf7X44ieSGoAxnttd16YWnCn-f5p9Fxym5mPhKyrGfZVCtRTp3bs03GVMKgNXo9hQeKcgWV8WMgL_nth1yBP3Dxs3zMTTPNMD19_57T_bhtBjKtjS_6kJKnMewgF9MnXd_AGrWFFkQlf6MVjU62EMeprYNa9bMj6i-W9bAdz_99DDATJG6jvV403K9W4aup5GWJRY2VaJsK6TOD4ZekKY5HIgkVe85ek"/>
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="bg-primary text-white p-2 rounded-full shadow-lg border-2 border-white">
<span class="material-symbols-outlined block">location_on</span>
</div>
</div>
<div class="absolute bottom-3 right-3">
<button class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-sm p-2 rounded-lg shadow-md border border-slate-200 dark:border-slate-700 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">my_location</span>
<span class="text-xs font-bold text-slate-700 dark:text-slate-200 uppercase tracking-wider">Locate Me</span>
</button>
</div>
</div>
<!-- Manual Address Entry -->
<div class="relative">
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary h-14 p-4 pl-12 text-base font-normal shadow-sm transition-all" placeholder="Enter street address and number" type="text"/>
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
<span class="material-symbols-outlined text-xl">search</span>
</div>
</div>
<div class="grid grid-cols-2 gap-3 mt-1">
<input class="form-input rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary h-12 px-4 text-sm" placeholder="Apt / Suite" type="text"/>
<input class="form-input rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary h-12 px-4 text-sm" placeholder="Zip Code" type="text"/>
</div>
</div>
</div>
<!-- Sticky Bottom Button -->
<div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-light dark:from-background-dark via-background-light/95 dark:via-background-dark/95 to-transparent">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-[0_8px_30px_rgb(242,89,13,0.3)] transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span>Finish Setup</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<div class="h-4"></div> <!-- iOS Home Indicator spacing -->
</div>
</div>
</body></html>
