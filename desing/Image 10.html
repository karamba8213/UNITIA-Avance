<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2590d",
                        "background-light": "#f8f6f5",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .custom-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23f2590d' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center">
<div class="relative flex h-full min-h-screen w-full max-w-[430px] flex-col bg-white dark:bg-background-dark shadow-2xl overflow-x-hidden">
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined cursor-pointer">arrow_back_ios</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12 font-display">Complete Profile</h2>
</div>
<div class="px-6 flex flex-col items-center text-center">
<div class="mt-8 mb-6 p-4 bg-primary/10 rounded-full">
<span class="material-symbols-outlined text-primary text-5xl">phonelink_ring</span>
</div>
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-[32px] font-bold leading-tight pb-3 font-display">Verify Phone Number</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed pb-8 max-w-[320px]">
                Enter your phone number to secure your account and start collaborating locally with secure cash payments.
            </p>
</div>
<div class="flex flex-col gap-5 px-6 py-3 w-full">
<div class="flex flex-col w-full">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal pb-2 uppercase tracking-wider font-display">Country Code</label>
<div class="relative">
<select class="custom-select block w-full rounded-xl text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 h-14 pl-4 pr-10 text-base font-normal leading-normal transition-all outline-none">
<option value="us">🇺🇸 United States (+1)</option>
<option value="uk">🇬🇧 United Kingdom (+44)</option>
<option value="ca">🇨🇦 Canada (+1)</option>
<option value="au">🇦🇺 Australia (+61)</option>
<option value="in">🇮🇳 India (+91)</option>
</select>
</div>
</div>
<div class="flex flex-col w-full">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal pb-2 uppercase tracking-wider font-display">Phone Number</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
<span class="material-symbols-outlined text-xl">call</span>
</span>
<input class="flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 h-14 pl-12 pr-4 placeholder:text-slate-400 text-base font-normal leading-normal transition-all outline-none" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
</div>
<div class="mt-auto p-6 space-y-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group">
<span>Verify via SMS</span>
<span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<p class="text-center text-xs text-slate-400 dark:text-slate-500 px-4">
                By clicking "Verify", you agree to receive a one-time SMS code. Standard messaging and data rates may apply.
            </p>
</div>
<div class="h-8 bg-white dark:bg-background-dark"></div>
<div class="flex justify-center pb-2">
<div class="w-32 h-1 bg-slate-200 dark:bg-slate-800 rounded-full"></div>
</div>
</div>
</body></html>
