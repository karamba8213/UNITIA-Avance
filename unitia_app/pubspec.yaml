name: unitia_app
description: "Unitia — Cada pedido suma a una causa real"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2

  # Google & Apple Sign In
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # State management
  provider: ^6.1.2

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  google_fonts: ^6.2.1

  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Notifications
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.0

  # In-App Purchases
  in_app_purchase: ^3.1.13

  # Crypto (admin password hashing)
  crypto: ^3.0.3

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
