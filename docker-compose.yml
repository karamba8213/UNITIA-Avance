version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: unitia_db
    environment:
      POSTGRES_USER: unitia
      POSTGRES_PASSWORD: unitia
      POSTGRES_DB: unitia_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unitia']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
